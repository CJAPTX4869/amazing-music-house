server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    # 大文件上传时避免 Tomcat 提前吞掉请求体导致连接重置
    max-swallow-size: -1

spring:
  application:
    name: music-server

  datasource:
    # MySQL 8.4：caching_sha2_password 认证需 allowPublicKeyRetrieval=true，否则报 Public Key Retrieval is not allowed
    url: jdbc:mysql://localhost:3306/music_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true

  servlet:
    multipart:
      max-file-size: 100MB        # 单文件上限
      max-request-size: 110MB     # 略大于单文件上限（含表单开销）

  mvc:
    # 配合 NoHandlerFoundException（Boot 2.7 无 NoResourceFoundException）
    throw-exception-if-no-handler-found: true

  web:
    resources:
      # 关闭默认静态资源映射：存储目录不允许被静态暴露，只能通过接口访问
      add-mappings: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted      # 全局逻辑删除字段
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

app:
  jwt:
    # 生产环境必须配置 JWT_SECRET（≥32 字节）；留空时后端为本次启动生成随机密钥并告警，
    secret: ${JWT_SECRET:}
    expiration: 604800000            # 7 天（毫秒）；token 有效期，调小更安全、调大免频繁登录
  cors:
    # 生产环境请通过环境变量 CORS_ALLOWED_ORIGINS 指定具体域名，多个用逗号分隔
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  storage:
    # 存储根目录。相对路径由 FileStorageServiceImpl 基于「项目目录」解析（不依赖启动时的工作目录），
    # 因此项目整体移动、或用 IDEA / 命令行启动都能正确指向 music-server/storage。
    # 需要放到别处时用环境变量 STORAGE_PATH 指定绝对路径即可。
    root-path: ${STORAGE_PATH:./storage}
    max-file-size: 104857600           # 100MB
    min-free-space: 1073741824         # 剩余空间低于 1GB 拒绝上传
    # 注意：wma 已移除 —— Chromium（网页端/桌面端）从很早就不支持 WMA 解码，
    # 放进来会导致"能导入但永远无法播放"，故不允许上传。
    allowed-extensions: mp3,wav,flac,aac,m4a,ogg
    allowed-mime-types: audio/mpeg,audio/wav,audio/x-wav,audio/flac,audio/x-flac,audio/aac,audio/mp4,audio/ogg

logging:
  level:
    root: info
    com.example.music: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
