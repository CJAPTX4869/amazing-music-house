server:
  port: 8080
  # 默认对所有网卡开放：网页用户端要给局域网其他设备访问。
  # 管理接口不受此影响 —— JwtInterceptor 已按来源 IP 锁死只允许 127.0.0.1/::1。
  # 只想本机用时设环境变量 SERVER_ADDRESS=127.0.0.1 收紧。
  address: ${SERVER_ADDRESS:0.0.0.0}
  servlet:
    context-path: /api
  tomcat:
    # 大文件上传时避免 Tomcat 提前吞掉请求体导致连接重置
    max-swallow-size: -1

spring:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 3000
  application:
    name: music-server

  datasource:
    # MySQL 8.4：caching_sha2_password 认证需 allowPublicKeyRetrieval=true，否则报 Public Key Retrieval is not allowed
    # 连接地址也走变量：本机默认 localhost，服务器上用 MYSQL_URL 覆盖即可，不用改代码
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/music_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    # 注意：这里不写默认值（Spring 不支持 shell 的 ${VAR:?提示} 写法，写了会把提示文本当成用户名）。
    # 不设变量时启动即报 "Could not resolve placeholder 'MYSQL_USERNAME'"，属于预期行为。
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      filters: stat,wall                # SQL 统计 + 防火墙
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000          # 超过 1 秒标记为慢 SQL
        wall:
          enabled: true
      web-stat-filter:                   # Web 请求与 URI 监控
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.css,*.gif,*.jpg,*.png,*.svg,*.ico,/druid/*"
      stat-view-servlet:                 # 监控页：/api/druid
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: ${DRUID_VIEW_PASSWORD:admin123}
        reset-enable: false              # 禁止页面上一键清空统计

  servlet:
    multipart:
      max-file-size: 100MB        # 单文件上限
      max-request-size: 110MB     # 略大于单文件上限（含表单开销）

  mvc:
    # 配合 NoHandlerFoundException（Boot 2.7 无 NoResourceFoundException）
    throw-exception-if-no-handler-found: true

  web:
    resources:
      # 关闭默认静态资源映射：存储目录不允许被静态暴露，只能通过接口访问
      add-mappings: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted      # 全局逻辑删除字段
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

app:
  recovery-code: ${RECOVERY_CODE:}  # 忘记密码：空值=禁用找回，生产用环境变量覆盖
  jwt:
    # 生产环境必须配置 JWT_SECRET（≥32 字节）；留空时后端为本次启动生成随机密钥并告警，
    secret: ${JWT_SECRET:}
    expiration: 604800000            # 7 天（毫秒）；token 有效期，调小更安全、调大免频繁登录
  cors:
    # 默认放行本机开发端口 + null/file://（Electron 桌面端用 file:// 加载页面，Chromium
    # 发出的 Origin 是字面量 null 或 file://（新版 44+ 为 file://），封面 img 带
    # crossorigin=anonymous 必须放行才能显示/取色；
    # 生产必须用 CORS_ALLOWED_ORIGINS 指定域名（逗号分隔）
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,null,file://}

  storage:
    # 存储根目录。相对路径由 FileStorageServiceImpl 基于「项目目录」解析（不依赖启动时的工作目录），
    # 因此项目整体移动、或用 IDEA / 命令行启动都能正确指向 music-server/storage。
    # 需要放到别处时用环境变量 STORAGE_PATH 指定绝对路径即可。
    root-path: ${STORAGE_PATH:./storage}
    max-file-size: 104857600           # 100MB
    min-free-space: 1073741824         # 剩余空间低于 1GB 拒绝上传
    # 注意：wma 已移除 —— Chromium（网页端/桌面端）从很早就不支持 WMA 解码，
    # 放进来会导致"能导入但永远无法播放"，故不允许上传。
    allowed-extensions: mp3,wav,flac,aac,m4a,ogg
    allowed-mime-types: audio/mpeg,audio/wav,audio/x-wav,audio/flac,audio/x-flac,audio/aac,audio/mp4,audio/ogg

logging:
  level:
    root: info
    com.example.music: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
